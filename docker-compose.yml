version: '3.8'

services:
  # 1. FastAPI Python ML Backend Service
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: plant_disease_backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - ENVIRONMENT=development
      - POSTGRES_HOST=db
      - REDIS_HOST=redis
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./backend:/app
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s

  # 2. Next.js / React Frontend Service
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: plant_disease_frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    env_file:
      - .env
    environment:
      - NODE_ENV=development
    depends_on:
      - backend
    volumes:
      - ./frontend/src:/app/src
      - ./frontend/public:/app/public

  # 3. PostgreSQL 16 Relational Database Service
  db:
    image: postgres:16-alpine
    container_name: plant_disease_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres_password_2026}
      POSTGRES_DB: ${POSTGRES_DB:-plant_disease_db}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-plant_disease_db}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # 4. Redis 7 Cache & Message Broker Service
  redis:
    image: redis:7-alpine
    container_name: plant_disease_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # 5. Celery Asynchronous Background Worker
  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: plant_disease_worker
    restart: unless-stopped
    command: celery -A backend.app.workers.celery_app.celery_app worker --loglevel=info
    env_file:
      - .env
    environment:
      - ENVIRONMENT=development
      - POSTGRES_HOST=db
      - REDIS_HOST=redis
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
    depends_on:
      redis:
        condition: service_healthy
      db:
        condition: service_healthy
    volumes:
      - ./backend:/app


volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
