name: Continuous Integration & Code Quality Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  lint-and-test:
    name: Code Formatting, Security Scan & Pytest Suite
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Backend & Testing Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install pytest pytest-asyncio black ruff bandit httpx

      - name: Check Code Formatting (Black)
        run: |
          black --check .

      - name: Run Code Linter (Ruff)
        run: |
          ruff check .

      - name: Run Security Vulnerability Scan (Bandit)
        run: |
          bandit -r backend scripts -s B101,B104,B110,B310


      - name: Run Automated Pytest Suite
        run: |
          pytest tests/ --verbose
